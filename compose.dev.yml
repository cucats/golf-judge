# Local testing: docker compose -f compose.dev.yml up --build
# Then open http://localhost:3000 and log in with your account.
services:
  app:
    build:
      context: .
      args:
        BUILD_ORIGIN: http://localhost:3000
    cap_add: [SYS_ADMIN, NET_ADMIN] # isolate sandboxing; matches prod
    security_opt: [seccomp=unconfined, apparmor=unconfined]
    environment:
      DATABASE_URL: postgres://user:password@db:5432/codegolf
      INSECURE_COOKIES: '1' # session cookie over plain http
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@cucats.org}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@cucats.org}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: codegolf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d codegolf']
      interval: 2s
      retries: 30
