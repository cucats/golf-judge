{% extends "base.html" %}

{% block title %}Login - CUCaTS Code Golf{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-screen">
    <h1>CUCaTS Code Golf</h1>

    <form method="POST" action="/login" class="flex flex-col gap-4 w-full max-w-md">
        <input
            type="text"
            name="username"
            value="{{ username }}"
            maxlength="32"
            placeholder="Username"
            required
            autofocus
        />
        <input type="password" name="password" placeholder="Password" required>
        <p class="muted">First time? Pick any username and password. You'll need the same password to log back in.</p>
        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit">Join</button>
    </form>

    {% if let Some(err) = error %}
        <p class="error" style="margin-top: 16px;">{{ err }}</p>
    {% endif %}
</div>
{% endblock %}
