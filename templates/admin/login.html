{% extends "base.html" %}

{% block title %}Admin Login - CUCaTS Code Golf{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-screen">
    <h1>Admin Login</h1>

    <form method="POST" action="/admin/login" class="flex flex-col gap-4 w-full max-w-md">
        <div class="field">
            <label for="username">Display name</label>
            <input
                type="text"
                id="username"
                name="username"
                value="{{ username }}"
                maxlength="32"
                required
                autofocus
            />
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit">Log in</button>
    </form>

    {% if let Some(err) = error %}
        <p class="error" style="margin-top: 16px;">{{ err }}</p>
    {% endif %}
</div>
{% endblock %}
