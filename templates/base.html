<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CUCaTS Code Golf{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script defer src="/static/js/highlight.js"></script>
</head>
<body>
    <div class="nav">
        <div>
            <a href="/"><strong>CUCaTS Code Golf</strong></a>
        </div>
        <div class="nav-user">
            {% block nav_extra %}{% endblock %}
            {% if viewer.is_admin %}
                <a href="/admin">Admin</a>
            {% endif %}
            {% if let Some(user) = viewer.username %}
                <span class="nav-username">{{ user }}</span>
                <a href="/change-password">Change password</a>
                <form method="POST" action="/logout" style="display:inline">
                    <button type="submit" class="link-btn">Logout</button>
                </form>
            {% else %}
                <a href="/login">Login</a>
            {% endif %}
        </div>
    </div>
    {% block content %}{% endblock %}
</body>
</html>
