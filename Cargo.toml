[package]
name = "golf"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.1"
askama = "0.14.0"
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
pulldown-cmark = "0.13.4"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres"] }
time = "0.3.55"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = "0.5.3"
tower-cookies = "0.11.0"
tower-http = { version = "0.6.11", features = ["fs"] }
tower-sessions = "0.14.0"
urlencoding = "2.1.3"
