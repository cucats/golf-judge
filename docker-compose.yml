services:
  app:
    build: .
    restart: unless-stopped
    # isolate needs namespaces, mounts and a sandbox loopback; this is
    # narrower than privileged: true (no host devices, no other capabilities)
    cap_add: [SYS_ADMIN, NET_ADMIN]
    security_opt: [seccomp=unconfined, apparmor=unconfined]
    environment:
      DATABASE_URL: postgres://user:password@db:5432/codegolf
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - golf
      - proxy

  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: codegolf
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - golf

volumes:
  db_data:

networks:
  golf:
  proxy:
    external: true
